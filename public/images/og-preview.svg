<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#2a1f0e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B7355"/>
      <stop offset="100%" style="stop-color:#a8896a"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circle top-right -->
  <circle cx="980" cy="-60" r="320" fill="#8B7355" opacity="0.12"/>
  <!-- Decorative circle bottom-left -->
  <circle cx="180" cy="720" r="280" fill="#8B7355" opacity="0.08"/>

  <!-- Dot grid pattern -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="1.2" fill="#ffffff" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Left accent bar -->
  <rect x="80" y="100" width="5" height="430" rx="3" fill="url(#accent)"/>

  <!-- Brand label -->
  <text x="112" y="148" font-family="Georgia, serif" font-size="13" font-weight="700" letter-spacing="4" fill="#8B7355" text-transform="uppercase">IMPRENTA · LAS CONDES, SANTIAGO</text>

  <!-- Main title -->
  <text x="112" y="240" font-family="Georgia, serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-1">Imprenta</text>
  <text x="112" y="326" font-family="Georgia, serif" font-size="72" font-weight="900" fill="#a8896a">Salvador Dalí</text>

  <!-- Divider line -->
  <rect x="112" y="358" width="120" height="3" rx="2" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="112" y="410" font-family="Arial, sans-serif" font-size="22" fill="#c8b99a" letter-spacing="0.5">Stickers · Tarjetas · Volantes · Pendones</text>

  <!-- Express badge -->
  <rect x="112" y="450" width="220" height="52" rx="26" fill="#8B7355"/>
  <text x="222" y="483" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Entrega en 48 hrs</text>

  <!-- WhatsApp badge -->
  <rect x="352" y="450" width="210" height="52" rx="26" fill="#ffffff" opacity="0.1"/>
  <text x="457" y="483" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">💬 Cotiza gratis</text>

  <!-- Right side: service cards -->
  <g transform="translate(760, 120)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="80" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="26">🎯</text>
    <text x="64" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Stickers Personalizados</text>
    <text x="64" y="52" font-family="Arial, sans-serif" font-size="13" fill="#8B7355">Vinilo · Troquelado · Transparente</text>

    <!-- Card 2 -->
    <rect x="0" y="96" width="340" height="80" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="24" y="130" font-family="Arial, sans-serif" font-size="26">🪪</text>
    <text x="64" y="126" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Tarjetas de Presentación</text>
    <text x="64" y="148" font-family="Arial, sans-serif" font-size="13" fill="#8B7355">Mate · Brillo · Barniz UV</text>

    <!-- Card 3 -->
    <rect x="0" y="192" width="340" height="80" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="24" y="226" font-family="Arial, sans-serif" font-size="26">📢</text>
    <text x="64" y="222" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Volantes y Pendones</text>
    <text x="64" y="244" font-family="Arial, sans-serif" font-size="13" fill="#8B7355">1.000 volantes desde $20.000</text>

    <!-- Card 4 -->
    <rect x="0" y="288" width="340" height="80" rx="16" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="24" y="322" font-family="Arial, sans-serif" font-size="26">🏷️</text>
    <text x="64" y="318" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Etiquetas Personalizadas</text>
    <text x="64" y="340" font-family="Arial, sans-serif" font-size="13" fill="#8B7355">DTF Textil · Bolsas · Productos</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="575" width="1200" height="55" fill="#000000" opacity="0.3"/>
  <text x="112" y="609" font-family="Arial, sans-serif" font-size="14" fill="#8B7355" letter-spacing="1">www.imprentasalvadordalichile.cl</text>
  <text x="1088" y="609" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.4" text-anchor="end">Mayecura 1177, Las Condes</text>
</svg>
